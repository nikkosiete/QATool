Image Fits | major | Always check if image placed is not cut off, should always show the main image subject

Content Placement Issues by Design | major | Ensure content is placed according to the wireframe or FCD and is not misaligned, cut off, or placed in incorrect sections.

Missing content/ Incomplete content - cells are blank

Mobile Draft Image | major | Mobile Draft Image was not added to the site.

Content Migrated - Includes Images | major | Ensure all written and image content provided in the FCD or by the client has been fully migrated to the new build site.
Headline Present and Relevant to Content on Page | major | Every page should have a clear headline that matches the page’s topic and content; avoid missing or misleading headers.

Button Added to Each Page | major | Confirm that every page includes at least one visible button or call-to-action (CTA) to engage users.

1st DL in Final Content Doc. Appears 1st on Site | major | Ensure that the first design layout (DL) described in the FCD is the first visible section on the live homepage.
1st Homepage Paragraph in FCD Appears 1st on Site | major | Confirm that the first paragraph of homepage content from the FCD is the first paragraph displayed on the homepage.
Site Map/Navigation Follows FCD Unless Otherwise Noted | major | Review the new build’s menu structure and ensure it follows the FCD-provided sitemap, unless the client has provided updated direction.
Social Links Added, Correct and Visible | major | Make sure all provided social links are on the site, visible, have no contrast issues, and are linked correctly.
Features Added | major | Only include four features on the homepage. Add more only if requested in the ticket.
FDA Disclaimer/Age Verification Modal Added | major | Insert a pop-up modal for disclaimer and age verification if the content is not suitable for all ages.

Template/Example Site Elements Present/Left Over | major | Remove all template images, colors, icons, etc. and ensure everything has been updated.
Text Color Causes Visibility Issues Including Form Fields | major | Check the text color in the form fields to ensure it's visible and passes the WCAG extension.
Less Than 75% Whitespace Visible At Any Viewpoint | major | Remove any excess whitespace to ensure nothing is cut off from view.
Colors Pass WCAG AA | major | When using WCAG, make sure the 'AA' level is also checked or passed according to the extension.
Feature(s) Link(s) to Correct Page | major | Make sure the features are linked to their respective pages and use the link checker extension to verify them.
Features Optimized For Mobile View | major | Always double-check the features section in mobile view to ensure there is no overlap.
Client Particulars Followed | major | Make sure all client details are complete before sending to QA.
External Links Open in a New Tab | major | Always set external links to open in a new tab if they link to another site.
On Page Link Links Correctly or Image/Link Works Properly | major | Make sure the image does not open in a new tab when clicked.
GMB Review Button Added and Linked Correctly | major | Use the shared link from Google Maps for the GMB review button.
Transparent Header Causing Issues | major | If you notice transparency, ensure the text and nav are visible and there’s no contrast issue.
Pre QA Backup Added | major | After checking the website, make sure a 'PreQA_Backup' has been added.
Floating Buttons Left Aligned | major | IF the client requested for a floating button, placement to the site should be left aligned
Header 25% or Less in Size | major | Make sure the header navbar size is no larger than 25% of the site and remains visible on mobile view and tablet view.
Pop-Up Modal Scrolling | major | Check all devices for any horizontal scrolling. If there is scrolling, review the text for overlap and resize it to remove the scroll.
Pure Black Paragraph Text Avoided | major | Use '#242424' for the hex code of black.
Page Slugs Have Proper Hyphen/Underscore Placement | major | Double-check the page slug title to ensure only one dash "-" is used, and avoid using "&" or "and" — always use a dash "-" instead.
Page Slugs Correlate with Page Titles | major | Make sure the page name matches the slug.
Navigation Added, Visible and/or has Critical Functionality Issue(s) | major | Ensure the nav bar links are correct and that clicking them doesn’t lead to a 404 page.
DL Links | major | Always check the ticket for requests to add a button with a link. If none, ensure the button links to the contact page.

Form Notifications Configured and Configured Correctly | major | Check that the email is correct and matches the one provided in the ticket.
Form Fields Marked as Required on Contact Form | major | Ensure all fields on the form are marked as required.
Form Added with Headline or Description, Unless Directly Stated in Content Above | major | Make sure the headline above the form is a properly formatted text block.
Placeholder Text Avoided in Form Fields | major | Don't insert placeholder text in the form.

NAPH Correct | major | No incorrect business information visible to the website
NAPH Formatted Correctly | major | Business info should be formatted correctly when placed in the website
NAPH Added to Business Info | major | Business info are correctly added in DUDA business info tab

Address/Directions/Map follow Visibility Request | major | Correct Address/Directions/Map is setup in the website
Map Directs to a Correct Location | major | Make sure the map address in the website is connected to the address in the parent ticket

TS App Added | major | Templated TS App embed code in Body HTML, should be replaced with the correct business TS App
Branding/Logo Added | major | Add the Business logo to the TS App

TS App Covering Information/Elements | major | When TS App is placed in the site. Check if it's covering any text, especially in mobile platform
TS App Default Text Changed | major | Update the TS App Title text and description with relate to business/service offered`;

const ser=a=>[...new Set(a.map(i=>i.cat))].map(c=>'## '+c+'\n'+a.filter(i=>i.cat==c).map(i=>[i.t,i.sev,i.ds].join(' | ')).join('\n')).join('\n');
const cats=()=>[...new Set(parse(S.text).map(i=>i.cat))];
const openCp=(i,ci)=>{if(!isLead())return;S.mo={t:'cp',i:i<0?-1:i,cat:ci==null?'':cats()[ci]};drawMo()};
function cpMo(){const a=parse(S.text),it=S.mo.i>=0?a[S.mo.i]:{cat:S.mo.cat,sev:'major'};
  return mh(S.mo.i>=0?'Edit checkpoint':'Add checkpoint')+`<div class="fm"><div><label>Category (type a new one to create it)</label><input id="c_cat" list="c_cl" value="${esc(it.cat)}"><datalist id="c_cl">${cats().map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div><div><label>Severity</label><select id="c_sev">${['critical','major','minor'].map(v=>`<option ${it.sev==v?'selected':''}>${v}</option>`).join('')}</select></div><div style="grid-column:1/-1"><label>Checkpoint (error title)</label><input id="c_t" value="${esc(it.t||'')}"></div><div style="grid-column:1/-1"><label>Guidance (what QA must check)</label><textarea id="c_ds" rows="3">${esc(it.ds||'')}</textarea></div></div>`+foot('saveCp()',S.mo.i>=0?'Save changes':'Add checkpoint')}
async function saveCp(){const g=k=>$('#c_'+k).value.trim().replace(/\|/g,'/'),a=parse(S.text),i=S.mo.i,o={cat:g('cat'),t:g('t'),sev:g('sev'),ds:g('ds')};if(!o.cat||!o.t)return toast('Category and checkpoint title are required');
  if(a.some((x,n)=>n!=i&&x.t.toLowerCase()==o.t.toLowerCase()))return toast('That checkpoint already exists');
  if(i>=0)a[i]={...a[i],...o};else{let p=-1;a.forEach((x,n)=>{if(x.cat==o.cat)p=n});a.splice(p<0?a.length:p+1,0,o)}
  try{await saveList(ser(a))}catch(e){return toast(e.message)}closeMo();toast('Checklist updated');draw()}
function delCp(i){const a=parse(S.text);ask('Delete "'+a[i].t+'"? Future audits will no longer include it.','Delete',async()=>{a.splice(i,1);try{await saveList(ser(a))}catch(e){toast(e.message)}draw()})}
async function mvCp(i,d){const a=parse(S.text);let j=i+d;while(a[j]&&a[j].cat!=a[i].cat)j+=d;if(!a[j])return;[a[i],a[j]]=[a[j],a[i]];try{await saveList(ser(a))}catch(e){toast(e.message)}draw()}
const openCat=ci=>{if(!isLead())return;S.mo={t:'cat',c:cats()[ci]};drawMo()};
const catMo=()=>mh('Rename category')+`<div class="fm" style="grid-template-columns:1fr"><div><label>Category name</label><input id="k_n" value="${esc(S.mo.c)}"></div></div>`+foot('saveCat()','Save');
async function saveCat(){const n=$('#k_n').value.trim().replace(/\|/g,'/'),a=parse(S.text);if(!n)return toast('Name required');a.forEach(i=>{if(i.cat==S.mo.c)i.cat=n});try{await saveList(ser(a))}catch(e){return toast(e.message)}closeMo();draw()}
function delCat(ci){const c=cats()[ci];ask('Delete the category "'+c+'" and all its checkpoints?','Delete',async()=>{try{await saveList(ser(parse(S.text).filter(i=>i.cat!=c)))}catch(e){toast(e.message)}draw()})}
const togC=ci=>{const c=cats()[ci];S.ac[c]=!S.ac[c];draw()};
function listView(){const a=parse(S.text),cs=cats(),ed=isLead(),q=(S.cq||'').toLowerCase(),cnt=v=>a.filter(i=>i.sev==v).length,m=i=>!q||(i.t+' '+i.ds+' '+i.cat).toLowerCase().includes(q);
  return`<h1>Checklist</h1><p class="sub">${a.length} checkpoints in ${cs.length} categories · ${cnt('critical')} critical · ${cnt('major')} major · ${cnt('minor')} minor. Edits apply to future audits only. ${ed?'':'<span class="pill wn">View only</span>'}</p>
  <div class="card row"><input id="cq" placeholder="Search checkpoints…" value="${esc(S.cq||'')}" oninput="S.cq=this.value;draw();const i=$('#cq');i.focus();i.setSelectionRange(99,99)"><span style="flex:1"></span>${ed?'<button class="btn" onclick="openCp(-1)">+ Add checkpoint</button>':''}<button class="btn g" onclick="S.ac=Object.fromEntries(cats().map(c=>[c,1]));draw()">Expand all</button><button class="btn g" onclick="S.ac={};draw()">Collapse all</button>${ed?'<button class="btn g" onclick="S.rw=!S.rw;draw()">Bulk edit text</button>':''}</div>
  ${S.rw&&ed?`<div class="card"><textarea id="cl" rows="14" style="font-family:ui-monospace,Menlo,monospace">${esc(S.text)}</textarea><div class="row" style="margin-top:10px"><button class="btn" onclick="saveList($('#cl').value).then(()=>{S.rw=0;toast('Checklist saved');draw()}).catch(e=>toast(e.message))">Save text</button></div></div>`:''}
  ${cs.map((c,ci)=>{const l=a.map((i,n)=>[i,n]).filter(([i])=>i.cat==c&&m(i));if(q&&!l.length)return'';const open=S.ac[c]||q;return`<div class="card"><div class="row" style="justify-content:space-between;cursor:pointer" onclick="togC(${ci})"><h2 style="margin:0">${open?'▾':'▸'} ${esc(c)} <span class="mut" style="font-weight:400">${l.length}</span></h2>${ed?`<span class="row" onclick="event.stopPropagation()"><button class="btn g" onclick="openCp(-1,${ci})">+ Add</button><button class="btn g" onclick="openCat(${ci})">Rename</button><button class="btn g" onclick="delCat(${ci})">Delete</button></span>`:''}</div>${open?l.map(([i,n])=>`<div class="cp"><div class="x"><b>${esc(i.t)}</b><span class="sev ${i.sev}">${i.sev}</span><div class="mut" style="font-size:12px;margin-top:2px">${esc(i.ds)}</div></div>${ed?`<span class="row"><button class="btn g" onclick="mvCp(${n},-1)" aria-label="Move up">▲</button><button class="btn g" onclick="mvCp(${n},1)" aria-label="Move down">▼</button><button class="btn g" onclick="openCp(${n})">Edit</button><button class="btn g" onclick="delCp(${n})">Delete</button></span>`:''}</div>`).join(''):''}</div>`}).join('')}`}
init();
</script></body></html>
